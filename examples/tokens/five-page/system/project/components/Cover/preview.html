<style>body{margin:0}.c{position:relative;width:960px;height:288px;background:var(--paper,var(--surface,#fff));overflow:hidden}svg{position:absolute;inset:0}.b0{fill:var(--accent-1);rx:var(--radius-3)}.b1{fill:var(--accent-2);rx:var(--radius-3)}.b2{fill:var(--accent-3);rx:var(--radius-3)}.b3{fill:var(--ink);rx:var(--radius-3)}.b4{fill:var(--mute);rx:var(--radius-3)}.b5{fill:var(--accent-1);rx:var(--radius-3)}.pt{fill:var(--paper)}.pt2{fill:var(--surface)}.n{font-family:var(--font-display);font-size:80px;font-weight:800;fill:var(--ink);letter-spacing:0}.t{font-family:var(--font-body);font-size:13px;fill:var(--mute,var(--ink))}</style>
<div class="c"><svg width="960" height="288" viewBox="0 0 960 288">

pattern: discs, because the source uses circles
scales: spacing unit 4px, radius token radius-3
-->

<rect class="b1" x="720" y="0" width="144" height="96"/>
<rect class="b2" x="864" y="0" width="96" height="144"/>

<rect class="b4" x="864" y="144" width="96" height="144"/>
<rect class="b5" x="480" y="192" width="240" height="96"/>
<circle class="pt" cx="600" cy="96" r="72"/>
<circle class="pt2" cx="792" cy="192" r="48"/>
<circle class="pt" cx="912" cy="216" r="36"/>
<text class="n" x="32" y="234"><tspan x="32" dy="0">Five Page</tspan></text><text class="t" x="32" y="262">7 colours, 7 type sizes, a 12-column grid.</text></svg></div>
